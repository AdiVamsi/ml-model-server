name: Train
on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"
jobs:
  train-and-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Set up Python
        run: uv python install 3.12
      - name: Install dependencies
        run: uv sync --all-extras --dev
      - name: Train
        run: uv run python train.py
      - name: Validation gate
        run: uv run python scripts/validate_model.py
      - name: Register model (stub)
        run: echo "[stub] register validated model version to MLflow registry"
